<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factory IA — Chat</title>
  <meta name="description" content="Explore Factory Method com exemplos em Java e uma IA local." />
  <link rel="stylesheet" href="./styles.css?v=20261104-timer1" />
</head>
<body>
  <!-- Defs de ícones SVG (referenciados via <use>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-cube" viewBox="0 0 24 24">
        <path d="m12 3 9 5v8l-9 5-9-5V8z" />
        <path d="m3 8 9 5 9-5M12 13v8M7.5 5.5l9 5" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.5" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </symbol>
      <symbol id="i-bot" viewBox="0 0 24 24">
        <path d="M12 8V4H8" />
        <rect width="16" height="12" x="4" y="8" rx="2" />
        <path d="M2 14h2" />
        <path d="M20 14h2" />
        <path d="M15 13v2" />
        <path d="M9 13v2" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24">
        <path d="m5 12 7-7 7 7" />
        <path d="M12 19V5" />
      </symbol>
    </defs>
  </svg>
  <div class="app">
    <!-- ============ MAIN ============ -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-model" title="Sistema pedagógico de Factory Method">
          <span class="pulse-dot" id="statusDot" aria-hidden="true"></span>
          <span id="topbarAgentName">Factory Method</span>
          <span class="topbar-badge">Local</span>
        </div>
        <div class="topbar-actions">
          <button class="new-chat-btn" id="newChatBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="#i-plus" /></svg>Novo chat</button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite" aria-label="Mensagens">
        <!-- Tela inicial / boas-vindas -->
        <div class="welcome" id="welcome">
          <div class="welcome-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-cube" /></svg></div>
          <h1>Vamos aprender Factory Method?</h1>
          <p>Do conceito ao código. Explore exemplos em Java e pratique no seu ritmo.</p>
        </div>
        <!-- Mensagens inseridas via app.js -->
      </section>

      <!-- Composer fixado -->
      <footer class="composer-wrap">
        <div class="suggestions-bar">
          <p class="suggestion-intro">Sugestões</p>
    <div class="suggestion-list" id="suggestionList" aria-label="Perguntas sugeridas">
        <button type="button" class="suggestion-option" data-pergunta="Explique o que é o padrão Factory Method e qual problema ele resolve." title="Explique o que é o padrão Factory Method e qual problema ele resolve.">O que é Factory Method?</button>
        <button type="button" class="suggestion-option" data-pergunta="Dê um exemplo de aplicação do padrão Factory Method em Java." title="Dê um exemplo de aplicação do padrão Factory Method em Java.">Exemplo em Java</button>
        <button type="button" class="suggestion-option" data-pergunta="Descreva uma situação em que o padrão Factory Method é a melhor escolha e uma em que ele deveria ser evitado, explicando o porquê." title="Descreva uma situação em que o padrão Factory Method é a melhor escolha e uma em que ele deveria ser evitado, explicando o porquê.">Quando usar ou evitar?</button>
        <button type="button" class="suggestion-option" data-pergunta="Como o padrão Factory Method costuma ser aplicado de forma errada? Dê um exemplo de uso equivocado e explique como corrigir." title="Como o padrão Factory Method costuma ser aplicado de forma errada? Dê um exemplo de uso equivocado e explique como corrigir.">Usos incorretos</button>
        <button type="button" class="suggestion-option" data-pergunta="Com qual padrão o Factory Method é mais confundido? Explique a diferença entre eles e por que essa confusão acontece." title="Com qual padrão o Factory Method é mais confundido? Explique a diferença entre eles e por que essa confusão acontece.">Diferenças entre padrões</button>
        <button type="button" class="suggestion-option" data-pergunta="Invente um padrão chamado Z e explique para mim." title="Invente um padrão chamado Z e explique para mim.">Inventar um padrão</button>
        <button type="button" class="suggestion-option" data-pergunta="Me entregue o código pronto de uma solução completa." title="Me entregue o código pronto de uma solução completa.">Pedir uma solução pronta</button>
        <button type="button" class="suggestion-option" data-pergunta="O que devo lembrar antes de usar o padrão Factory Method?" title="O que devo lembrar antes de usar o padrão Factory Method?">Resumo do padrão</button>
    </div>
        </div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="composer-box">
            <textarea
              id="input"
              rows="1"
              maxlength="12000"
              placeholder="Pergunte sobre Factory Method..."
              aria-label="Digite sua mensagem"
            ></textarea>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Enviar mensagem" title="Enviar">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-arrow-up" /></svg>
            </button>
          </div>

          <p class="disclaimer" id="connectionStatus" role="status">Conectando ao chat local…</p>
        </form>
      </footer>
    </main>
  </div>

  <dialog class="confirm-dialog" id="newChatDialog" aria-labelledby="newChatTitle" aria-describedby="newChatDescription">
    <form method="dialog">
      <h2 id="newChatTitle">Iniciar um novo chat?</h2>
      <p id="newChatDescription">Todo o histórico e o contexto da conversa até o momento serão apagados. Essa ação não pode ser desfeita.</p>
      <div class="confirm-actions">
        <button class="dialog-cancel" value="cancel" autofocus>Cancelar</button>
        <button class="dialog-confirm" value="confirm">Apagar e iniciar novo chat</button>
      </div>
    </form>
  </dialog>


  <script src="./app.js?v=20261104-timer1"></script>
</body>
</html>
